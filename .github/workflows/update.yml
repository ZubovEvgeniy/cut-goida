name: Auto Update Configs

on:
  schedule:
    - cron: "0 */6 * * *"  # cron
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск скрипта
        run: python main.py

      - name: Сохранение и отправка изменений
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add configs/*.txt
          git commit -m "Автообновление конфигов VLESS/Reality" || echo "Нет новых конфигов для сохранения"
          git push
